---
- name: Resize homelab-core root disk on Proxmox
  hosts: proxmox
  gather_facts: false
  vars_files:
    - ../../../../ansible/inventories/production/group_vars/all.yml
    - ../../../../ansible/inventories/production/group_vars/homelab_core.yml

  tasks:
    - name: Read VM configuration
      ansible.builtin.command: "qm config {{ vm_id }}"
      register: vm_config
      changed_when: false

    - name: Read configured root disk size from Proxmox config
      ansible.builtin.shell: |
        set -euo pipefail
        qm config {{ vm_id }} \
          | awk -F'size=' '/^{{ vm_root_disk_slot }}:/{print $2}' \
          | awk -F',' '{print $1}' \
          | sed 's/[[:space:]]//g'
      args:
        executable: /bin/bash
      register: current_root_disk_size
      changed_when: false

    - name: Fail when root disk slot is missing from VM config
      ansible.builtin.fail:
        msg: "Could not find {{ vm_root_disk_slot }} in VM {{ vm_id }} configuration"
      when: current_root_disk_size.stdout | trim | length == 0

    - name: Set root disk resize facts
      ansible.builtin.set_fact:
        current_root_disk_size_raw: "{{ current_root_disk_size.stdout | trim }}"
        target_root_disk_size_raw: "{{ vm_root_disk_size_gb | string | trim }}"
        current_root_disk_size_gb: "{{ (current_root_disk_size.stdout | trim | regex_replace('[^0-9]', '')) | int }}"
        target_root_disk_size_gb: "{{ (vm_root_disk_size_gb | string | trim | regex_replace('[^0-9]', '')) | int }}"

    - name: Show parsed root disk sizes
      ansible.builtin.debug:
        msg:
          - "Current detected disk size: {{ current_root_disk_size_raw }}"
          - "Requested target disk size: {{ target_root_disk_size_raw }}"
          - "Parsed current disk size (GiB): {{ current_root_disk_size_gb }}"
          - "Parsed target disk size (GiB): {{ target_root_disk_size_gb }}"

    - name: Fail when requested size would shrink the root disk
      ansible.builtin.fail:
        msg: >-
          Requested vm_root_disk_size_gb={{ target_root_disk_size_gb }}G is smaller than
          current size {{ current_root_disk_size_gb }}G. Shrinking disks is not supported.
      when: (target_root_disk_size_gb | int) < (current_root_disk_size_gb | int)

    - name: Resize root disk when target is larger
      ansible.builtin.command: >-
        qm resize {{ vm_id }} {{ vm_root_disk_slot }} +{{ (target_root_disk_size_gb | int) - (current_root_disk_size_gb | int) }}G
      when: (target_root_disk_size_gb | int) > (current_root_disk_size_gb | int)

    - name: Root disk already at requested size
      ansible.builtin.debug:
        msg: "Root disk already at {{ current_root_disk_size_gb }}G; nothing to resize on Proxmox"
      when: (target_root_disk_size_gb | int) == (current_root_disk_size_gb | int)

- name: Expand root partition and filesystem inside homelab-core
  hosts: homelab_core
  gather_facts: false
  become: true

  tasks:
    - name: Ensure guest disk growth tools are installed
      ansible.builtin.apt:
        name:
          - cloud-guest-utils
          - e2fsprogs
        state: present
        update_cache: true

    - name: Capture root filesystem size before expansion
      ansible.builtin.command: "df --output=size -BG /"
      register: root_size_before
      changed_when: false

    - name: Capture root filesystem source device
      ansible.builtin.command: "findmnt -n -o SOURCE /"
      register: root_source
      changed_when: false

    - name: Capture root disk parent device
      ansible.builtin.command: "lsblk -no PKNAME {{ root_source.stdout | trim }}"
      register: root_parent_disk
      changed_when: false

    - name: Set root expansion facts
      ansible.builtin.set_fact:
        root_partition_parent: "{{ root_parent_disk.stdout | trim }}"
        root_partition_number: >-
          {{
            (root_source.stdout | trim)
            | regex_replace('^/dev/', '')
            | regex_replace('^' ~ (root_parent_disk.stdout | trim), '')
            | int
          }}

    - name: Expand root partition to fill disk
      ansible.builtin.command: >-
        growpart /dev/{{ root_partition_parent }} {{ root_partition_number }}
      register: growpart_result
      changed_when: "'NOCHANGE' not in (growpart_result.stdout + growpart_result.stderr)"

    - name: Expand ext filesystem on root partition
      ansible.builtin.command: "resize2fs {{ root_source.stdout | trim }}"
      register: resize2fs_result
      changed_when: "'Nothing to do' not in resize2fs_result.stdout"

    - name: Capture root filesystem size after expansion
      ansible.builtin.command: "df --output=size -BG /"
      register: root_size_after
      changed_when: false

    - name: Show root filesystem growth summary
      ansible.builtin.debug:
        msg: >-
          Root filesystem size changed from
          {{ (root_size_before.stdout_lines[1] | trim).replace('G', '') }}G to
          {{ (root_size_after.stdout_lines[1] | trim).replace('G', '') }}G

    - name: Verify root filesystem is at least as large as before
      ansible.builtin.assert:
        that:
          - (root_size_after.stdout_lines[1] | trim).replace('G', '') | int >= (root_size_before.stdout_lines[1] | trim).replace('G', '') | int
        fail_msg: "Root filesystem did not grow as expected"
        success_msg: "Root filesystem expansion check passed"
