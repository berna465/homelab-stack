---
- name: Provision homelab-core VM on Proxmox
  hosts: proxmox
  gather_facts: false
  vars_files:
    - ../../../../ansible/inventories/production/group_vars/all.yml
    - ../../../../ansible/inventories/production/group_vars/homelab_core.yml

  tasks:
    - name: Check whether VM already exists
      ansible.builtin.command: "qm status {{ vm_id }}"
      register: vm_status
      changed_when: false
      failed_when: false

    - name: Set VM existence flag
      ansible.builtin.set_fact:
        vm_exists: "{{ vm_status.rc == 0 }}"

    - name: VM already exists, skipping configuration
      ansible.builtin.debug:
        msg: "VM {{ vm_id }} already exists, skipping configuration"
      when: vm_exists

    - name: Clone VM from template when missing
      ansible.builtin.command: >-
        qm clone {{ vm_template_id }} {{ vm_id }} --name {{ vm_name }}
      when: not vm_exists

    - name: Configure CPU and memory
      ansible.builtin.command: >-
        qm set {{ vm_id }} --cores {{ vm_cores }} --memory {{ vm_memory }}
      when: not vm_exists

    - name: Configure network bridge
      ansible.builtin.command: >-
        qm set {{ vm_id }} --net0 virtio,bridge={{ vm_bridge }}
      when: not vm_exists

    - name: Configure cloud-init network and user
      ansible.builtin.command: >-
        qm set {{ vm_id }} --ipconfig0 {{ vm_ipconfig0 }} --ciuser {{ vm_ci_user }}
      when: not vm_exists

    - name: Upload SSH public key file to Proxmox node
      ansible.builtin.copy:
        dest: /tmp/homelab-core.pub
        content: "{{ vm_ssh_public_key }}"
        mode: '0600'
      when: not vm_exists

    - name: Configure cloud-init SSH key
      ansible.builtin.command: >-
        qm set {{ vm_id }} --sshkeys /tmp/homelab-core.pub
      when: not vm_exists

    - name: Skip root disk resize during VM creation (run as explicit next step)
      ansible.builtin.debug:
        msg: >-
          Root disk resize is intentionally separated from VM creation for stability.
          Run infra/proxmox/ansible/playbooks/resize-root-disk.yml as a subsequent step when needed.
      when: not vm_exists

    - name: Start VM
      ansible.builtin.command: "qm start {{ vm_id }}"
      register: vm_start
      failed_when: vm_start.rc != 0 and ('already running' not in vm_start.stderr | lower)
      changed_when: "'already running' not in vm_start.stderr | lower"

- name: Wait for VM SSH
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Wait until SSH is reachable on homelab-core
      ansible.builtin.wait_for:
        host: "{{ hostvars['homelab-core'].ansible_host }}"
        port: 22
        delay: 5
        timeout: 300
        state: started
