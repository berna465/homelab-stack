---
- name: Mount NAS NFS shares on homelab-core
  hosts: homelab_core
  gather_facts: false
  become: true
  vars_files:
    - ../../../../ansible/inventories/production/group_vars/all.yml

  tasks:
    - name: Ensure NFS client packages are installed
      ansible.builtin.apt:
        name:
          - nfs-common
        state: present
        update_cache: true
        lock_timeout: 600

    - name: Check NAS mount root status
      ansible.builtin.stat:
        path: "{{ nas_nfs_mount_root }}"
      register: nas_mount_root_stat

    - name: Fail when NAS mount root exists but is not a directory
      ansible.builtin.fail:
        msg: "NAS mount root {{ nas_nfs_mount_root }} exists but is not a directory"
      when: nas_mount_root_stat.stat.exists and not nas_mount_root_stat.stat.isdir

    - name: Ensure NAS mount root exists when missing
      ansible.builtin.file:
        path: "{{ nas_nfs_mount_root }}"
        state: directory
        mode: '0755'
      when: not nas_mount_root_stat.stat.exists

    - name: Check NAS mountpoints status
      ansible.builtin.stat:
        path: "{{ item.mountpoint }}"
      loop: "{{ nas_nfs_mounts }}"
      register: nas_mountpoint_stats

    - name: Fail when a NAS mountpoint exists but is not a directory
      ansible.builtin.fail:
        msg: "NAS mountpoint {{ item.item.mountpoint }} exists but is not a directory"
      loop: "{{ nas_mountpoint_stats.results }}"
      when: item.stat.exists and not item.stat.isdir

    - name: Ensure NAS mountpoints exist when missing
      ansible.builtin.file:
        path: "{{ item.item.mountpoint }}"
        state: directory
        mode: '0755'
      loop: "{{ nas_mountpoint_stats.results }}"
      when: not item.stat.exists

    - name: Mount NFS shares and persist in fstab
      ansible.posix.mount:
        path: "{{ item.mountpoint }}"
        src: "{{ nas_nfs_server }}:{{ item.export }}"
        fstype: nfs
        opts: defaults,_netdev
        state: mounted
      loop: "{{ nas_nfs_mounts }}"

    - name: Check whether NAS config root exists
      ansible.builtin.stat:
        path: "{{ nas_config_root }}"
      register: nas_config_root_stat

    - name: Report NAS config root status
      ansible.builtin.debug:
        msg: >-
          NAS config root {{ nas_config_root }} is {{ 'present' if nas_config_root_stat.stat.exists else 'not present' }}.
          Repo defaults remain active when this directory is absent.
