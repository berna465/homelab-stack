---
- name: Check optional immich NAS env override file
  ansible.builtin.stat:
    path: "{{ immich_nas_env_file }}"
  register: immich_nas_env_stat

- name: Ensure immich stack and local persistence directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ immich_app_dir }}"
    - "{{ immich_runtime_dir }}"
    - "{{ immich_runtime_dir }}/model-cache"
    - "{{ immich_db_dir }}"
    - "{{ immich_cache_dir }}"

- name: Prepare deploy user and shared NFS group mapping
  ansible.builtin.include_tasks: "{{ role_path }}/../../../../../platform/foundations/ansible/tasks/prepare-vm-identity.yml"

- name: Check canonical immich content path state
  ansible.builtin.stat:
    path: "{{ immich_content_dir }}"
  register: immich_content_dir_stat

- name: Check legacy immich upload path state
  ansible.builtin.stat:
    path: "{{ immich_legacy_content_dir }}"
  register: immich_legacy_content_dir_stat
  when: immich_allow_legacy_upload_fallback | bool

- name: Resolve effective immich content path
  ansible.builtin.set_fact:
    immich_effective_content_dir: >-
      {{
        immich_content_dir
        if (immich_content_dir_stat.stat.exists | default(false))
        else (
          immich_legacy_content_dir
          if (immich_allow_legacy_upload_fallback | bool and (immich_legacy_content_dir_stat.stat.exists | default(false)))
          else immich_content_dir
        )
      }}

- name: Warn when legacy immich upload path fallback is used
  ansible.builtin.debug:
    msg: >-
      Canonical Immich content path is {{ immich_content_dir }},
      but it is missing. Falling back to legacy path {{ immich_legacy_content_dir }} for compatibility.
      Create/migrate to {{ immich_content_dir }} when ready.
  when:
    - immich_effective_content_dir == immich_legacy_content_dir

- name: Verify immich NAS content path exists and is writable by deploy identity
  ansible.builtin.include_tasks: "{{ role_path }}/../../../../../platform/foundations/ansible/tasks/verify-nfs-path-writable.yml"
  vars:
    nfs_check_label: immich content path
    nfs_check_path: "{{ immich_effective_content_dir }}"

- name: Verify immich NAS backups path exists and is writable by deploy identity
  ansible.builtin.include_tasks: "{{ role_path }}/../../../../../platform/foundations/ansible/tasks/verify-nfs-path-writable.yml"
  vars:
    nfs_check_label: immich backups path
    nfs_check_path: "{{ immich_exports_dir }}"

- name: Copy immich docker-compose definition
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../../stacks/immich/compose.yaml"
    dest: "{{ immich_app_dir }}/docker-compose.yml"
    mode: '0644'

- name: Copy immich environment example file for local reference
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../../stacks/immich/.env.example"
    dest: "{{ immich_app_dir }}/.env.example"
    mode: '0644'

- name: Check existing immich runtime .env path type
  ansible.builtin.stat:
    path: "{{ immich_app_dir }}/.env"
  register: immich_runtime_env_stat

- name: Remove existing immich runtime .env symlink before baseline copy
  ansible.builtin.file:
    path: "{{ immich_app_dir }}/.env"
    state: absent
  when: immich_runtime_env_stat.stat.islnk | default(false)

- name: Initialize immich runtime .env from repo default baseline
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../../stacks/immich/.env.example"
    dest: "{{ immich_app_dir }}/.env"
    mode: '0644'

- name: Validate immich NAS env override is readable by deploy user
  ansible.builtin.command: "test -r {{ immich_nas_env_file | quote }}"
  become: false
  changed_when: false
  register: immich_nas_env_readable
  when: immich_nas_env_stat.stat.exists and immich_nas_env_stat.stat.isreg

- name: Fail when immich NAS env override is not readable
  ansible.builtin.fail:
    msg: >-
      NAS immich env file {{ immich_nas_env_file }} is not readable by deploy user {{ ansible_user | default('unknown') }}.
      Fix NAS ACL/permissions and re-run deploy.
  when:
    - immich_nas_env_stat.stat.exists and immich_nas_env_stat.stat.isreg
    - immich_nas_env_readable.rc != 0

- name: Merge NAS immich env override on top of baseline .env
  ansible.builtin.shell: |
    set -eu
    python3 - <<'PY'
    from pathlib import Path

    base_path = Path("{{ immich_app_dir }}/.env")
    override_path = Path("{{ immich_nas_env_file }}")

    def parse_env(path):
        data = {}
        order = []
        for line in path.read_text().splitlines():
            if not line or line.lstrip().startswith("#") or "=" not in line:
                continue
            key, value = line.split("=", 1)
            key = key.strip()
            if not key:
                continue
            if key not in data:
                order.append(key)
            data[key] = value
        return data, order

    base, base_order = parse_env(base_path)
    override, override_order = parse_env(override_path)

    legacy_ml_cache = override.get("ML_CACHE_LOCATION", "").strip()
    explicit_model_cache = override.get("IMMICH_MODEL_CACHE_LOCATION", "").strip()
    if legacy_ml_cache and not explicit_model_cache:
        override["IMMICH_MODEL_CACHE_LOCATION"] = legacy_ml_cache
        if "IMMICH_MODEL_CACHE_LOCATION" not in override_order:
            override_order.append("IMMICH_MODEL_CACHE_LOCATION")

    if "ML_CACHE_LOCATION" in override:
        del override["ML_CACHE_LOCATION"]
    override_order = [key for key in override_order if key != "ML_CACHE_LOCATION"]

    for key in override_order:
        base[key] = override[key]
        if key not in base_order:
            base_order.append(key)

    if "ML_CACHE_LOCATION" in base:
        del base["ML_CACHE_LOCATION"]
    base_order = [key for key in base_order if key != "ML_CACHE_LOCATION"]

    lines = [f"{key}={base[key]}" for key in base_order]
    base_path.write_text("\n".join(lines) + "\n")
    PY
  changed_when: false
  when: immich_nas_env_stat.stat.exists and immich_nas_env_stat.stat.isreg

- name: Align runtime UPLOAD_LOCATION with resolved immich content path
  ansible.builtin.shell: |
    set -eu
    python3 - <<'PY'
    from pathlib import Path

    env_path = Path("{{ immich_app_dir }}/.env")
    target = "{{ immich_effective_content_dir }}"

    lines = env_path.read_text().splitlines()
    out = []
    found = False

    for line in lines:
      if line.lstrip().startswith("#") or "=" not in line:
        out.append(line)
        continue
      key, _ = line.split("=", 1)
      key = key.strip()
      if key == "UPLOAD_LOCATION":
        out.append(f"UPLOAD_LOCATION={target}")
        found = True
      else:
        out.append(line)

    if not found:
      out.append(f"UPLOAD_LOCATION={target}")

    env_path.write_text("\n".join(out) + "\n")
    PY
  changed_when: false

- name: Validate immich required environment variables are set in runtime .env
  ansible.builtin.shell: |
    set -eu
    required_vars='IMMICH_VERSION IMMICH_REDIS_IMAGE UPLOAD_LOCATION DB_DATA_LOCATION IMMICH_MODEL_CACHE_LOCATION IMMICH_REDIS_PATH DB_USERNAME DB_PASSWORD DB_DATABASE_NAME'
    missing=""
    for key in $required_vars; do
      if ! awk -F= -v k="$key" '
        BEGIN { found=0 }
        $0 ~ /^[[:space:]]*#/ { next }
        $1 ~ /^[[:space:]]*$/ { next }
        {
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)
          if ($1 == k) {
            value = substr($0, index($0, "=") + 1)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
            if (length(value) > 0) { found=1; exit 0 }
          }
        }
        END { if (!found) exit 1 }
      ' .env; then
        missing="${missing}${key}\n"
      fi
    done

    if [ -n "$missing" ]; then
      printf "%b" "$missing"
      exit 1
    fi
  args:
    chdir: "{{ immich_app_dir }}"
  changed_when: false
  failed_when: false
  register: immich_env_check

- name: Fail when immich runtime .env is missing required variables
  ansible.builtin.fail:
    msg: >-
      Immich runtime .env at {{ immich_app_dir }}/.env is missing required variables: {{ immich_env_check.stdout_lines | join(', ') }}.
      Populate required values in apps/stacks/immich/.env.example defaults and/or NAS override {{ immich_nas_env_file }}.
  when: immich_env_check.rc != 0

- name: Read immich upload path from runtime .env
  ansible.builtin.shell: |
    set -eu
    awk -F= '
      BEGIN { value="" }
      $0 ~ /^[[:space:]]*#/ { next }
      {
        key=$1
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
        if (key == "UPLOAD_LOCATION") {
          value=substr($0, index($0, "=") + 1)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
          print value
          exit 0
        }
      }
      END {
        if (length(value) == 0) exit 1
      }
    ' .env
  args:
    chdir: "{{ immich_app_dir }}"
  changed_when: false
  register: immich_upload_location

- name: Verify resolved immich upload path exists and is writable by deploy identity
  ansible.builtin.include_tasks: "{{ role_path }}/../../../../../platform/foundations/ansible/tasks/verify-nfs-path-writable.yml"
  vars:
    nfs_check_label: immich resolved upload path
    nfs_check_path: "{{ immich_upload_location.stdout | trim }}"

- name: Start immich service with docker compose
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ immich_app_dir }}"

- name: Verify immich containers report healthy runtime state
  ansible.builtin.shell: |
    set -eu
    python3 - <<'PY'
    import json
    import subprocess
    import sys

    containers = [
        "immich-server",
        "immich-machine-learning",
        "immich-redis",
        "immich-database",
    ]

    for name in containers:
        raw = subprocess.check_output(["docker", "inspect", name], text=True)
        data = json.loads(raw)[0]
        state = data["State"]
        health = state.get("Health", {})
        status = health.get("Status", state.get("Status", "unknown"))
        if status != "healthy":
            print(f"{name}={status}")
            sys.exit(1)
    PY
  register: immich_health
  changed_when: false
  until: immich_health.rc == 0
  retries: "{{ immich_healthcheck_retries }}"
  delay: "{{ immich_healthcheck_delay }}"
