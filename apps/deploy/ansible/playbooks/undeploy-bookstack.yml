---
- name: Undeploy bookstack stack from homelab-core and delete state
  hosts: homelab_core
  gather_facts: false
  become: true
  vars_files:
    - ../../../../ansible/inventories/production/group_vars/all.yml
    - ../../../../ansible/inventories/production/group_vars/homelab_core.yml
  vars:
    bookstack_purge_local_state: true
    bookstack_purge_nas_state: true
  pre_tasks:
    - name: Load optional NAS group var and secret overrides
      ansible.builtin.include_tasks: ../../../../platform/foundations/ansible/tasks/load-nas-overrides.yml
      vars:
        nas_override_var_files:
          - "{{ nas_config_group_vars_dir }}/all.yml"
          - "{{ nas_config_group_vars_dir }}/homelab_core.yml"
          - "{{ nas_config_secrets_dir }}/all.yml"
          - "{{ nas_config_secrets_dir }}/homelab_core.yml"

  tasks:
    - name: Check bookstack stack directory exists
      ansible.builtin.stat:
        path: "{{ bookstack_app_dir }}"
      register: bookstack_app_dir_stat

    - name: Stop bookstack stack with docker compose down
      ansible.builtin.command: docker compose down --remove-orphans
      args:
        chdir: "{{ bookstack_app_dir }}"
      when: bookstack_app_dir_stat.stat.exists and bookstack_app_dir_stat.stat.isdir

    - name: Delete bookstack local stack/state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ bookstack_app_dir }}"
        - "{{ bookstack_runtime_dir }}"
        - "{{ bookstack_db_dir }}"
      when: bookstack_purge_local_state | bool

    - name: Delete bookstack NAS content and backup directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ bookstack_content_dir }}"
        - "{{ bookstack_exports_dir }}"
      become: false
      when: bookstack_purge_nas_state | bool
