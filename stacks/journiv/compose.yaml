# Journiv PostgreSQL-based stack adapted for /data (local) + /mnt/nas (content) layout.
x-base-env: &base-env
  REDIS_URL: redis://valkey:6379/0
  CELERY_BROKER_URL: redis://valkey:6379/0
  CELERY_RESULT_BACKEND: redis://valkey:6379/0
  DB_DRIVER: postgres
  POSTGRES_HOST: postgres

x-celery-common: &celery-common
  image: ${JOURNIV_IMAGE}
  env_file: .env
  volumes:
    - ${JOURNIV_RUNTIME_PATH}:/data
    - ${JOURNIV_CONTENT_PATH}:/data/media
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy
  networks:
    - backend
  restart: unless-stopped

x-app-common: &app-common
  image: ${JOURNIV_IMAGE}
  env_file: .env
  volumes:
    - ${JOURNIV_RUNTIME_PATH}:/data
    - ${JOURNIV_CONTENT_PATH}:/data/media
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy
  networks:
    - backend
  restart: unless-stopped

x-celery-healthcheck: &celery-healthcheck
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 40s

services:
  postgres:
    image: postgres:18.1
    container_name: journiv-postgres-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${JOURNIV_POSTGRES_PATH}:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  valkey:
    image: valkey/valkey:9.0-alpine
    container_name: journiv-valkey-cache
    restart: unless-stopped
    volumes:
      - ${JOURNIV_VALKEY_PATH}:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  celery-worker:
    <<: *celery-common
    container_name: journiv-celery-worker
    command: >
      celery -A app.core.celery_app worker --loglevel=info
      --concurrency=${CELERY_WORKER_CONCURRENCY}
      --max-memory-per-child=${CELERY_WORKER_MAX_MEMORY_PER_CHILD_KB}
      --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD}
    environment:
      <<: *base-env
      SERVICE_ROLE: celery-worker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      <<: *celery-healthcheck

  celery-beat:
    <<: *celery-common
    container_name: journiv-celery-beat
    command: celery -A app.core.celery_app beat --loglevel=info --scheduler redbeat.RedBeatScheduler --pidfile=/tmp/celerybeat.pid
    environment:
      <<: *base-env
      SERVICE_ROLE: celery-beat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDBEAT_REDIS_URL: redis://valkey:6379/2
    healthcheck:
      <<: *celery-healthcheck

  app:
    <<: *app-common
    container_name: journiv-postgres-app
    ports:
      - "${JOURNIV_PORT}:8000"
    environment:
      <<: *base-env
      SERVICE_ROLE: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ENVIRONMENT: production
      RATE_LIMIT_STORAGE_URI: redis://valkey:6379/1
    networks:
      - backend
      - frontend
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  admin-cli:
    <<: *app-common
    container_name: journiv-admin-cli
    profiles: ["admin"]
    command: ["sleep", "infinity"]
    environment:
      <<: *base-env
      SERVICE_ROLE: admin-cli
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      disable: true

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
