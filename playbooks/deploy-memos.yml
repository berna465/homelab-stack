---
- name: Deploy memos stack to homelab-core
  hosts: homelab_core
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/homelab_core.yml
  pre_tasks:
    - name: Load optional NAS group var and secret overrides
      ansible.builtin.include_tasks: tasks/load-nas-overrides.yml
      vars:
        nas_override_var_files:
          - "{{ nas_config_group_vars_dir }}/all.yml"
          - "{{ nas_config_group_vars_dir }}/homelab_core.yml"
          - "{{ nas_config_secrets_dir }}/all.yml"
          - "{{ nas_config_secrets_dir }}/homelab_core.yml"

    - name: Check optional memos NAS env override file
      ansible.builtin.stat:
        path: "{{ memos_nas_env_file }}"
      register: memos_nas_env_stat

  tasks:
    - name: Ensure memos stack and runtime directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ memos_app_dir }}"
        - "{{ memos_data_dir }}"

    - name: Check memos NAS backups directory exists
      ansible.builtin.stat:
        path: "{{ memos_exports_dir }}"
      register: memos_exports_stat

    - name: Fail when memos NAS backups directory is missing
      ansible.builtin.fail:
        msg: >-
          Required NAS backup path {{ memos_exports_dir }} is missing.
          Create it under /mnt/nas/backups and ensure it is writable from the VM.
      when: not memos_exports_stat.stat.exists or not memos_exports_stat.stat.isdir

    - name: Check memos NAS backups directory writable by VM user
      ansible.builtin.command: "test -w {{ memos_exports_dir }}"
      become: false
      changed_when: false
      failed_when: false
      register: memos_exports_writable

    - name: Fail with explicit memos NAS backups permission guidance
      ansible.builtin.fail:
        msg: >-
          Required NAS backup path {{ memos_exports_dir }} is not writable by the VM SSH user ({{ ansible_user | default('unknown') }}).
          Ensure NFS permissions allow writes for this user (or mapped UID/GID), then re-run deploy.
      when: memos_exports_writable.rc != 0

    - name: Copy memos docker-compose definition
      ansible.builtin.copy:
        src: ../stacks/memos/compose.yaml
        dest: "{{ memos_app_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Copy memos environment file from NAS override when available
      ansible.builtin.copy:
        src: "{{ memos_nas_env_file }}"
        dest: "{{ memos_app_dir }}/.env"
        remote_src: true
        mode: '0644'
      when: memos_nas_env_stat.stat.exists and memos_nas_env_stat.stat.isreg

    - name: Copy memos environment file from repo default when NAS override is missing
      ansible.builtin.copy:
        src: ../stacks/memos/.env.example
        dest: "{{ memos_app_dir }}/.env"
        mode: '0644'
      when: not (memos_nas_env_stat.stat.exists and memos_nas_env_stat.stat.isreg)

    - name: Start memos service with docker compose
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ memos_app_dir }}"

    - name: Verify memos health endpoint returns 200
      ansible.builtin.uri:
        url: "{{ memos_healthcheck_url }}"
        status_code: "{{ memos_healthcheck_status }}"
        return_content: false
