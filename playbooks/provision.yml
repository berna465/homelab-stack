---
- name: Provision homelab-core VM on Proxmox
  hosts: proxmox
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/homelab_core.yml

  tasks:
    - name: Check whether VM already exists
      ansible.builtin.command: "qm status {{ vm_id }}"
      register: vm_status
      changed_when: false
      failed_when: false

    - name: Set VM existence flag
      ansible.builtin.set_fact:
        vm_exists: "{{ vm_status.rc == 0 }}"

    - name: VM already exists, skipping configuration
      ansible.builtin.debug:
        msg: "VM {{ vm_id }} already exists, skipping configuration"
      when: vm_exists

    - name: Clone VM from template when missing
      ansible.builtin.command: >-
        qm clone {{ vm_template_id }} {{ vm_id }} --name {{ vm_name }}
      when: not vm_exists

    - name: Configure CPU and memory
      ansible.builtin.command: >-
        qm set {{ vm_id }} --cores {{ vm_cores }} --memory {{ vm_memory }}
      when: not vm_exists

    - name: Configure network bridge
      ansible.builtin.command: >-
        qm set {{ vm_id }} --net0 virtio,bridge={{ vm_bridge }}
      when: not vm_exists

    - name: Configure cloud-init network and user
      ansible.builtin.command: >-
        qm set {{ vm_id }} --ipconfig0 {{ vm_ipconfig0 }} --ciuser {{ vm_ci_user }}
      when: not vm_exists

    - name: Upload SSH public key file to Proxmox node
      ansible.builtin.copy:
        dest: /tmp/homelab-core.pub
        content: "{{ vm_ssh_public_key }}"
        mode: '0600'
      when: not vm_exists

    - name: Configure cloud-init SSH key
      ansible.builtin.command: >-
        qm set {{ vm_id }} --sshkeys /tmp/homelab-core.pub
      when: not vm_exists

    - name: Read configured root disk size after clone
      ansible.builtin.shell: |
        set -euo pipefail
        qm config {{ vm_id }} \
          | awk -F'size=' '/^{{ vm_root_disk_slot }}:/{print $2}' \
          | awk -F',' '{print $1}' \
          | sed 's/[[:space:]]//g'
      args:
        executable: /bin/bash
      register: provision_current_root_disk_size
      changed_when: false
      when: not vm_exists

    - name: Fail when root disk slot is missing after clone
      ansible.builtin.fail:
        msg: "Could not find {{ vm_root_disk_slot }} in VM {{ vm_id }} configuration after clone"
      when:
        - not vm_exists
        - provision_current_root_disk_size.stdout | trim | length == 0

    - name: Set root disk sizing facts for initial provisioning
      ansible.builtin.set_fact:
        provision_current_root_disk_size_gb: "{{ (provision_current_root_disk_size.stdout | trim | regex_replace('[^0-9]', '')) | int }}"
        provision_target_root_disk_size_gb: "{{ (vm_root_disk_size_gb | string | trim | regex_replace('[^0-9]', '')) | int }}"
      when: not vm_exists

    - name: Fail when requested root disk size would shrink template disk
      ansible.builtin.fail:
        msg: >-
          Requested vm_root_disk_size_gb={{ provision_target_root_disk_size_gb }}G is smaller than
          cloned disk size {{ provision_current_root_disk_size_gb }}G. Shrinking is not supported.
      when:
        - not vm_exists
        - (provision_target_root_disk_size_gb | int) < (provision_current_root_disk_size_gb | int)

    - name: Resize root disk immediately during provisioning when target is larger
      ansible.builtin.command: >-
        qm resize {{ vm_id }} {{ vm_root_disk_slot }} +{{ (provision_target_root_disk_size_gb | int) - (provision_current_root_disk_size_gb | int) }}G
      when:
        - not vm_exists
        - (provision_target_root_disk_size_gb | int) > (provision_current_root_disk_size_gb | int)

    - name: Root disk already at requested size during provisioning
      ansible.builtin.debug:
        msg: "Root disk already at {{ provision_current_root_disk_size_gb }}G; no resize needed during provisioning"
      when:
        - not vm_exists
        - (provision_target_root_disk_size_gb | int) == (provision_current_root_disk_size_gb | int)

    - name: Start VM
      ansible.builtin.command: "qm start {{ vm_id }}"
      register: vm_start
      failed_when: vm_start.rc != 0 and ('already running' not in vm_start.stderr | lower)
      changed_when: "'already running' not in vm_start.stderr | lower"

- name: Wait for VM SSH
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Wait until SSH is reachable on homelab-core
      ansible.builtin.wait_for:
        host: "{{ hostvars['homelab-core'].ansible_host }}"
        port: 22
        delay: 5
        timeout: 300
        state: started
