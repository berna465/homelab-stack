---
- name: Validate required vars for NFS path verification
  ansible.builtin.assert:
    that:
      - nfs_check_path is defined
      - nfs_check_label is defined
      - homelab_vm_deploy_user is defined
      - homelab_nfs_shared_group_gid is defined
    fail_msg: >-
      verify-nfs-path-writable requires nfs_check_path, nfs_check_label,
      homelab_vm_deploy_user, and homelab_nfs_shared_group_gid.

- name: Check {{ nfs_check_label }} path exists
  ansible.builtin.stat:
    path: "{{ nfs_check_path }}"
  register: nfs_check_stat

- name: Fail when {{ nfs_check_label }} path is missing
  ansible.builtin.fail:
    msg: >-
      Required NAS path {{ nfs_check_path }} ({{ nfs_check_label }}) is missing.
      Create it on the NAS and ensure it is exported/mounted to the VM.
  when: not nfs_check_stat.stat.exists

- name: Fail when {{ nfs_check_label }} path is not a directory
  ansible.builtin.fail:
    msg: >-
      Required NAS path {{ nfs_check_path }} ({{ nfs_check_label }}) exists but is not a directory.
      Fix NAS-side path type and permissions, then re-run.
  when: nfs_check_stat.stat.exists and not nfs_check_stat.stat.isdir

- name: Show numeric ownership and mode for {{ nfs_check_label }} path
  ansible.builtin.command: "ls -ldn {{ nfs_check_path | quote }}"
  changed_when: false
  register: nfs_check_ls

- name: Log {{ nfs_check_label }} ownership diagnostics
  ansible.builtin.debug:
    msg:
      path: "{{ nfs_check_path }}"
      ls_ldn: "{{ nfs_check_ls.stdout }}"
      expected_shared_gid: "{{ homelab_nfs_shared_group_gid }}"
      path_uid: "{{ nfs_check_stat.stat.uid | default('unknown') }}"
      path_gid: "{{ nfs_check_stat.stat.gid | default('unknown') }}"
      path_mode: "{{ nfs_check_stat.stat.mode | default('unknown') }}"
      deploy_user: "{{ homelab_vm_deploy_user }}"
      deploy_user_groups: "{{ homelab_vm_deploy_user_groups | default([]) }}"

- name: Check {{ nfs_check_label }} path writable by deploy user via write probe
  ansible.builtin.shell: >-
    probe={{ nfs_check_path | quote }}/.ansible-write-test-$$ &&
    (umask 077 && : > "$probe") &&
    rm -f "$probe"
  become: false
  changed_when: false
  failed_when: false
  register: nfs_check_write

- name: Fail with actionable NAS ACL/NFS guidance when {{ nfs_check_label }} is not writable
  ansible.builtin.fail:
    msg: >-
      Required NAS path {{ nfs_check_path }} ({{ nfs_check_label }}) exists but is not writable by deploy user
      {{ homelab_vm_deploy_user }} on the VM.
      VM-side identity diagnostics: UID={{ homelab_vm_deploy_user_uid | default('unknown') }},
      primary GID={{ homelab_vm_deploy_user_gid | default('unknown') }},
      supplementary groups={{ homelab_vm_deploy_user_groups | default([]) | join(',') }}.
      Path diagnostics: {{ nfs_check_ls.stdout }}.
      Numeric owner/group on path: UID={{ nfs_check_stat.stat.uid | default('unknown') }}, GID={{ nfs_check_stat.stat.gid | default('unknown') }}.
      Expected shared writable group GID={{ homelab_nfs_shared_group_gid }}.
      {% if (nfs_check_stat.stat.uid | default(-1) | int) == 65534 or (nfs_check_stat.stat.gid | default(-1) | int) == 65534 %}
      Detected UID/GID 65534 (nobody/nogroup) mapping on this path: this usually means QNAP NFS anonymous/all-squash mapping.
      On NAS, disable anonymous squashing for this export OR map anonymous UID/GID to the intended writable identity,
      then grant RW ACLs to that UID/GID and re-run.
      {% else %}
      The VM deploy user is prepared for the expected group model, but NAS-side ACL/NFS export mapping
      is still denying writes. Fix permissions/ACL/export mapping on QNAP for this path and re-run.
      {% endif %}
  when: nfs_check_write.rc != 0
