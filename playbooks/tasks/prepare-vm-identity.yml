---
- name: Verify deploy user exists
  ansible.builtin.command: "id {{ homelab_vm_deploy_user }}"
  changed_when: false

- name: Read passwd entry for deploy user
  ansible.builtin.command: "getent passwd {{ homelab_vm_deploy_user }}"
  changed_when: false
  register: homelab_deploy_user_passwd

- name: Parse deploy user UID/GID
  ansible.builtin.set_fact:
    homelab_vm_deploy_user_uid: "{{ homelab_deploy_user_passwd.stdout.split(':')[2] | int }}"
    homelab_vm_deploy_user_gid: "{{ homelab_deploy_user_passwd.stdout.split(':')[3] | int }}"

- name: Check shared NFS group by name
  ansible.builtin.command: "getent group {{ homelab_nfs_shared_group_name }}"
  changed_when: false
  failed_when: false
  register: homelab_group_by_name

- name: Check shared NFS group by GID
  ansible.builtin.command: "getent group {{ homelab_nfs_shared_group_gid }}"
  changed_when: false
  failed_when: false
  register: homelab_group_by_gid

- name: Fail when shared group name exists with unexpected GID
  ansible.builtin.fail:
    msg: >-
      Group {{ homelab_nfs_shared_group_name }} already exists but does not map to expected
      GID {{ homelab_nfs_shared_group_gid }}.
      Current entry: {{ homelab_group_by_name.stdout }}.
      Align VM group mapping with NAS UID/GID expectations and re-run.
  when:
    - homelab_group_by_name.rc == 0
    - (homelab_group_by_name.stdout.split(':')[2] | int) != (homelab_nfs_shared_group_gid | int)

- name: Fail when expected GID is already used by another group name
  ansible.builtin.fail:
    msg: >-
      Expected shared GID {{ homelab_nfs_shared_group_gid }} is already owned by a different group.
      Current entry: {{ homelab_group_by_gid.stdout }}.
      Resolve VM group naming/mapping before continuing.
  when:
    - homelab_group_by_gid.rc == 0
    - (homelab_group_by_gid.stdout.split(':')[0]) != homelab_nfs_shared_group_name

- name: Ensure shared NFS group exists with expected GID
  ansible.builtin.group:
    name: "{{ homelab_nfs_shared_group_name }}"
    gid: "{{ homelab_nfs_shared_group_gid }}"
    state: present

- name: Ensure deploy user is a member of shared NFS group
  ansible.builtin.user:
    name: "{{ homelab_vm_deploy_user }}"
    groups: "{{ homelab_nfs_shared_group_name }}"
    append: true

- name: Collect deploy user identity after group alignment
  ansible.builtin.command: "id {{ homelab_vm_deploy_user }}"
  changed_when: false
  register: homelab_deploy_user_identity

- name: Collect deploy user supplementary groups by name
  ansible.builtin.command: "id -Gn {{ homelab_vm_deploy_user }}"
  changed_when: false
  register: homelab_deploy_user_group_names

- name: Set deploy user group diagnostics
  ansible.builtin.set_fact:
    homelab_vm_deploy_user_groups: "{{ homelab_deploy_user_group_names.stdout.split() }}"

- name: Show effective VM identity model diagnostics
  ansible.builtin.debug:
    msg:
      deploy_user: "{{ homelab_vm_deploy_user }}"
      deploy_user_uid: "{{ homelab_vm_deploy_user_uid }}"
      deploy_user_primary_gid: "{{ homelab_vm_deploy_user_gid }}"
      expected_shared_group_name: "{{ homelab_nfs_shared_group_name }}"
      expected_shared_group_gid: "{{ homelab_nfs_shared_group_gid }}"
      supplementary_groups: "{{ homelab_vm_deploy_user_groups }}"
      id_output: "{{ homelab_deploy_user_identity.stdout }}"
      group_by_name_before_create: "{{ homelab_group_by_name.stdout | default('missing-before-create') }}"
      group_by_gid_before_create: "{{ homelab_group_by_gid.stdout | default('missing-before-create') }}"

- name: Optionally enforce expected deploy user UID
  ansible.builtin.fail:
    msg: >-
      Deploy user {{ homelab_vm_deploy_user }} has UID {{ homelab_vm_deploy_user_uid }} but expected
      UID is {{ homelab_vm_deploy_user_expected_uid }}.
      Update VM user UID or variable override to align with NAS identity mapping.
  when:
    - homelab_vm_deploy_user_expected_uid is not none
    - (homelab_vm_deploy_user_uid | int) != (homelab_vm_deploy_user_expected_uid | int)
