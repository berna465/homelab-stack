---
- name: Check optional NAS override files
  ansible.builtin.stat:
    path: "{{ item }}"
  become: false
  loop: "{{ nas_override_var_files }}"
  register: nas_override_stats

- name: Include NAS override files that exist
  ansible.builtin.include_vars:
    file: "{{ item.item }}"
  loop: "{{ nas_override_stats.results }}"
  when:
    - item.stat.exists | default(false)
    - item.stat.isreg | default(false)
