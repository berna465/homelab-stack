---
- name: Deploy jellyfin stack to homelab-core
  hosts: homelab_core
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/homelab_core.yml
  pre_tasks:
    - name: Load optional NAS group var and secret overrides
      ansible.builtin.include_tasks: tasks/load-nas-overrides.yml
      vars:
        nas_override_var_files:
          - "{{ nas_config_group_vars_dir }}/all.yml"
          - "{{ nas_config_group_vars_dir }}/homelab_core.yml"
          - "{{ nas_config_secrets_dir }}/all.yml"
          - "{{ nas_config_secrets_dir }}/homelab_core.yml"

    - name: Check optional jellyfin NAS env override file
      ansible.builtin.stat:
        path: "{{ jellyfin_nas_env_file }}"
      register: jellyfin_nas_env_stat

  tasks:
    - name: Ensure jellyfin stack and local persistence directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ jellyfin_app_dir }}"
        - "{{ jellyfin_runtime_dir }}"
        - "{{ jellyfin_runtime_dir }}/config"
        - "{{ jellyfin_cache_dir }}"

    - name: Check jellyfin media root path exists
      ansible.builtin.stat:
        path: "{{ jellyfin_media_root_dir }}"
      register: jellyfin_media_root_stat

    - name: Fail when jellyfin media root path is missing
      ansible.builtin.fail:
        msg: >-
          Required media path {{ jellyfin_media_root_dir }} is missing.
          Mount NAS media share and create required media folders before deploying Jellyfin.
      when: not jellyfin_media_root_stat.stat.exists or not jellyfin_media_root_stat.stat.isdir

    - name: Prepare deploy user and shared NFS group mapping
      ansible.builtin.include_tasks: tasks/prepare-vm-identity.yml

    - name: Verify jellyfin NAS backups path exists and is writable by deploy identity
      ansible.builtin.include_tasks: tasks/verify-nfs-path-writable.yml
      vars:
        nfs_check_label: jellyfin backups path
        nfs_check_path: "{{ jellyfin_exports_dir }}"

    - name: Copy jellyfin docker-compose definition
      ansible.builtin.copy:
        src: ../stacks/jellyfin/compose.yaml
        dest: "{{ jellyfin_app_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Copy jellyfin environment file from NAS override when available
      ansible.builtin.copy:
        src: "{{ jellyfin_nas_env_file }}"
        dest: "{{ jellyfin_app_dir }}/.env"
        remote_src: true
        mode: '0644'
      when: jellyfin_nas_env_stat.stat.exists and jellyfin_nas_env_stat.stat.isreg

    - name: Copy jellyfin environment file from repo default when NAS override is missing
      ansible.builtin.copy:
        src: ../stacks/jellyfin/.env.example
        dest: "{{ jellyfin_app_dir }}/.env"
        mode: '0644'
      when: not (jellyfin_nas_env_stat.stat.exists and jellyfin_nas_env_stat.stat.isreg)

    - name: Start jellyfin service with docker compose
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ jellyfin_app_dir }}"

    - name: Verify jellyfin endpoint returns 200
      ansible.builtin.uri:
        url: "{{ jellyfin_healthcheck_url }}"
        status_code: "{{ jellyfin_healthcheck_status }}"
        return_content: false
