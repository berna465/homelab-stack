---
- name: Deploy whoami smoke-test stack to homelab-core
  hosts: homelab_core
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/homelab_core.yml
  pre_tasks:
    - name: Load optional NAS group var and secret overrides
      ansible.builtin.include_tasks: tasks/load-nas-overrides.yml
      vars:
        nas_override_var_files:
          - "{{ nas_config_group_vars_dir }}/all.yml"
          - "{{ nas_config_group_vars_dir }}/homelab_core.yml"
          - "{{ nas_config_secrets_dir }}/all.yml"
          - "{{ nas_config_secrets_dir }}/homelab_core.yml"

  tasks:
    - name: Ensure whoami stack directory exists
      ansible.builtin.file:
        path: "{{ homelab_core_app_dir }}"
        state: directory
        mode: '0755'

    - name: Copy docker-compose definition
      ansible.builtin.copy:
        src: ../files/homelab-core/docker-compose.yml
        dest: "{{ homelab_core_app_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Start whoami service with docker compose
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ homelab_core_app_dir }}"

    - name: Verify HTTP endpoint returns 200
      ansible.builtin.uri:
        url: "{{ homelab_core_healthcheck_url }}"
        status_code: "{{ homelab_core_healthcheck_status }}"
        return_content: false
