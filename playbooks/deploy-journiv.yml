---
- name: Deploy journiv stack to homelab-core
  hosts: homelab_core
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/homelab_core.yml

  tasks:
    - name: Ensure journiv stack and local persistence directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ journiv_app_dir }}"
        - "{{ journiv_runtime_dir }}"
        - "{{ journiv_db_dir }}"
        - "{{ journiv_cache_dir }}"

    - name: Ensure journiv NAS directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ journiv_media_dir }}"
        - "{{ journiv_exports_dir }}"

    - name: Show Journiv app uid/gid used for writable directories
      ansible.builtin.debug:
        msg: >-
          Using uid={{ journiv_app_uid }} gid={{ journiv_app_gid }}
          for {{ journiv_runtime_dir }} and {{ journiv_media_dir }} ownership.

    - name: Ensure journiv writable runtime and media subdirectories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ journiv_app_uid }}"
        group: "{{ journiv_app_gid }}"
        mode: '0775'
      loop:
        - "{{ journiv_runtime_dir }}"
        - "{{ journiv_runtime_dir }}/logs"
        - "{{ journiv_media_dir }}"

    - name: Copy journiv docker-compose definition
      ansible.builtin.copy:
        src: ../files/homelab-core/journiv/docker-compose.yml
        dest: "{{ journiv_app_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Copy journiv environment file
      ansible.builtin.copy:
        src: ../files/homelab-core/journiv/.env.example
        dest: "{{ journiv_app_dir }}/.env"
        mode: '0644'

    - name: Start journiv service with docker compose
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ journiv_app_dir }}"

    - name: Verify journiv endpoint returns 200
      ansible.builtin.uri:
        url: "{{ journiv_healthcheck_url }}"
        status_code: "{{ journiv_healthcheck_status }}"
        return_content: false
      register: journiv_health
      until: journiv_health.status == journiv_healthcheck_status
      retries: 20
      delay: 5
