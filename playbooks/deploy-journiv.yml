---
- name: Deploy journiv stack to homelab-core
  hosts: homelab_core
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/homelab_core.yml

  tasks:
    - name: Ensure journiv stack and local persistence directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ journiv_app_dir }}"
        - "{{ journiv_runtime_dir }}"
        - "{{ journiv_db_dir }}"
        - "{{ journiv_cache_dir }}"

    - name: Ensure journiv local writable runtime subdirectories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ journiv_app_uid }}"
        group: "{{ journiv_app_gid }}"
        mode: '0775'
      loop:
        - "{{ journiv_runtime_dir }}"
        - "{{ journiv_runtime_dir }}/logs"

    - name: Check journiv NAS content directory exists
      ansible.builtin.stat:
        path: "{{ journiv_content_dir }}"
      register: journiv_content_stat

    - name: Fail when journiv NAS content directory is missing
      ansible.builtin.fail:
        msg: >-
          Required NAS path {{ journiv_content_dir }} is missing.
          Create it under /mnt/nas/data/apps and ensure it is writable from the VM.
      when: not journiv_content_stat.stat.exists or not journiv_content_stat.stat.isdir

    - name: Check journiv NAS backups directory exists
      ansible.builtin.stat:
        path: "{{ journiv_exports_dir }}"
      register: journiv_exports_stat

    - name: Fail when journiv NAS backups directory is missing
      ansible.builtin.fail:
        msg: >-
          Required NAS backup path {{ journiv_exports_dir }} is missing.
          Create it and ensure it is writable from the VM.
      when: not journiv_exports_stat.stat.exists or not journiv_exports_stat.stat.isdir

    - name: Verify journiv NAS content directory is writable
      ansible.builtin.copy:
        dest: "{{ journiv_content_dir }}/.ansible-write-test"
        content: "ok\n"
        mode: '0644'

    - name: Remove journiv NAS content write-test file
      ansible.builtin.file:
        path: "{{ journiv_content_dir }}/.ansible-write-test"
        state: absent

    - name: Verify journiv NAS backups directory is writable
      ansible.builtin.copy:
        dest: "{{ journiv_exports_dir }}/.ansible-write-test"
        content: "ok\n"
        mode: '0644'

    - name: Remove journiv NAS backups write-test file
      ansible.builtin.file:
        path: "{{ journiv_exports_dir }}/.ansible-write-test"
        state: absent

    - name: Copy journiv docker-compose definition
      ansible.builtin.copy:
        src: ../files/homelab-core/journiv/docker-compose.yml
        dest: "{{ journiv_app_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Copy journiv environment file
      ansible.builtin.copy:
        src: ../files/homelab-core/journiv/.env.example
        dest: "{{ journiv_app_dir }}/.env"
        mode: '0644'

    - name: Start journiv service with docker compose
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ journiv_app_dir }}"

    - name: Verify journiv endpoint returns 200
      ansible.builtin.uri:
        url: "{{ journiv_healthcheck_url }}"
        status_code: "{{ journiv_healthcheck_status }}"
        return_content: false
      register: journiv_health
      until: journiv_health.status == journiv_healthcheck_status
      retries: 20
      delay: 5
