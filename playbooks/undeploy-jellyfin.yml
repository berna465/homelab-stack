---
- name: Undeploy jellyfin stack from homelab-core and delete state
  hosts: homelab_core
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/homelab_core.yml
  vars:
    jellyfin_purge_local_state: true
    jellyfin_purge_nas_state: true
  pre_tasks:
    - name: Load optional NAS group var and secret overrides
      ansible.builtin.include_tasks: tasks/load-nas-overrides.yml
      vars:
        nas_override_var_files:
          - "{{ nas_config_group_vars_dir }}/all.yml"
          - "{{ nas_config_group_vars_dir }}/homelab_core.yml"
          - "{{ nas_config_secrets_dir }}/all.yml"
          - "{{ nas_config_secrets_dir }}/homelab_core.yml"

  tasks:
    - name: Check jellyfin stack directory exists
      ansible.builtin.stat:
        path: "{{ jellyfin_app_dir }}"
      register: jellyfin_app_dir_stat

    - name: Stop jellyfin stack with docker compose down
      ansible.builtin.command: docker compose down --remove-orphans
      args:
        chdir: "{{ jellyfin_app_dir }}"
      when: jellyfin_app_dir_stat.stat.exists and jellyfin_app_dir_stat.stat.isdir

    - name: Delete jellyfin local stack/state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ jellyfin_app_dir }}"
        - "{{ jellyfin_runtime_dir }}"
        - "{{ jellyfin_cache_dir }}"
      when: jellyfin_purge_local_state | bool

    - name: Delete jellyfin NAS backup directory
      ansible.builtin.file:
        path: "{{ jellyfin_exports_dir }}"
        state: absent
      become: false
      when: jellyfin_purge_nas_state | bool
