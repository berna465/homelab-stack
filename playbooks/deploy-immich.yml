---
- name: Deploy immich stack to homelab-core
  hosts: homelab_core
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/homelab_core.yml
  pre_tasks:
    - name: Load optional NAS group var and secret overrides
      ansible.builtin.include_tasks: tasks/load-nas-overrides.yml
      vars:
        nas_override_var_files:
          - "{{ nas_config_group_vars_dir }}/all.yml"
          - "{{ nas_config_group_vars_dir }}/homelab_core.yml"
          - "{{ nas_config_secrets_dir }}/all.yml"
          - "{{ nas_config_secrets_dir }}/homelab_core.yml"

    - name: Check optional immich NAS env override file
      ansible.builtin.stat:
        path: "{{ immich_nas_env_file }}"
      register: immich_nas_env_stat

  tasks:
    - name: Ensure immich stack and local persistence directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ immich_app_dir }}"
        - "{{ immich_runtime_dir }}"
        - "{{ immich_runtime_dir }}/model-cache"
        - "{{ immich_db_dir }}"
        - "{{ immich_cache_dir }}"

    - name: Prepare deploy user and shared NFS group mapping
      ansible.builtin.include_tasks: tasks/prepare-vm-identity.yml

    - name: Verify immich NAS content path exists and is writable by deploy identity
      ansible.builtin.include_tasks: tasks/verify-nfs-path-writable.yml
      vars:
        nfs_check_label: immich content path
        nfs_check_path: "{{ immich_content_dir }}"

    - name: Verify immich NAS backups path exists and is writable by deploy identity
      ansible.builtin.include_tasks: tasks/verify-nfs-path-writable.yml
      vars:
        nfs_check_label: immich backups path
        nfs_check_path: "{{ immich_exports_dir }}"

    - name: Copy immich docker-compose definition
      ansible.builtin.copy:
        src: ../files/homelab-core/immich/docker-compose.yml
        dest: "{{ immich_app_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Copy immich environment example file for local reference
      ansible.builtin.copy:
        src: ../files/homelab-core/immich/.env.example
        dest: "{{ immich_app_dir }}/.env.example"
        mode: '0644'

    - name: Copy immich environment file from NAS override when available
      ansible.builtin.copy:
        src: "{{ immich_nas_env_file }}"
        dest: "{{ immich_app_dir }}/.env"
        remote_src: true
        mode: '0644'
      when: immich_nas_env_stat.stat.exists and immich_nas_env_stat.stat.isreg

    - name: Copy immich environment file from repo default when NAS override is missing
      ansible.builtin.copy:
        src: ../files/homelab-core/immich/.env.example
        dest: "{{ immich_app_dir }}/.env"
        mode: '0644'
      when: not (immich_nas_env_stat.stat.exists and immich_nas_env_stat.stat.isreg)

    - name: Validate immich required environment variables are set
      ansible.builtin.shell: |
        set -eu
        required_vars="IMMICH_SERVER_IMAGE IMMICH_ML_IMAGE IMMICH_REDIS_IMAGE IMMICH_POSTGRES_IMAGE IMMICH_POSTGRES_PATH IMMICH_REDIS_PATH IMMICH_MODEL_CACHE_PATH IMMICH_LIBRARY_PATH IMMICH_DB_USER IMMICH_DB_PASSWORD IMMICH_DB_NAME"
        missing=""
        for key in $required_vars; do
          value="$(grep -E "^${key}=" .env | tail -n1 | cut -d'=' -f2- || true)"
          if [ -z "$value" ]; then
            missing="$missing $key"
          fi
        done
        if [ -n "$missing" ]; then
          echo "$missing" | xargs -n1
          exit 1
        fi
      args:
        chdir: "{{ immich_app_dir }}"
      changed_when: false
      failed_when: false
      register: immich_env_check

    - name: Fallback to repo default immich .env when NAS override is incomplete
      ansible.builtin.copy:
        src: ../files/homelab-core/immich/.env.example
        dest: "{{ immich_app_dir }}/.env"
        mode: '0644'
      when:
        - immich_env_check.rc != 0
        - immich_nas_env_stat.stat.exists
        - immich_nas_env_stat.stat.isreg

    - name: Re-validate immich required environment variables after fallback
      ansible.builtin.shell: |
        set -eu
        required_vars="IMMICH_SERVER_IMAGE IMMICH_ML_IMAGE IMMICH_REDIS_IMAGE IMMICH_POSTGRES_IMAGE IMMICH_POSTGRES_PATH IMMICH_REDIS_PATH IMMICH_MODEL_CACHE_PATH IMMICH_LIBRARY_PATH IMMICH_DB_USER IMMICH_DB_PASSWORD IMMICH_DB_NAME"
        missing=""
        for key in $required_vars; do
          value="$(grep -E "^${key}=" .env | tail -n1 | cut -d'=' -f2- || true)"
          if [ -z "$value" ]; then
            missing="$missing $key"
          fi
        done
        if [ -n "$missing" ]; then
          echo "$missing" | xargs -n1
          exit 1
        fi
      args:
        chdir: "{{ immich_app_dir }}"
      changed_when: false
      failed_when: false
      register: immich_env_check_final
      when:
        - immich_env_check.rc != 0
        - immich_nas_env_stat.stat.exists
        - immich_nas_env_stat.stat.isreg

    - name: Set final immich env validation result
      ansible.builtin.set_fact:
        immich_env_check_effective: "{{ immich_env_check_final if (immich_env_check_final is defined) else immich_env_check }}"

    - name: Fail when immich .env is still missing required variables
      ansible.builtin.fail:
        msg: >-
          Immich .env at {{ immich_app_dir }}/.env is missing required variables: {{ immich_env_check_effective.stdout_lines | join(', ') }}.
          Populate the missing values in the NAS override env file ({{ immich_nas_env_file }}) or in files/homelab-core/immich/.env.example before deploy.
      when: immich_env_check_effective.rc != 0

    - name: Start immich service with docker compose
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ immich_app_dir }}"

    - name: Verify immich API endpoint responds with an accepted status code
      ansible.builtin.uri:
        url: "{{ immich_healthcheck_url }}"
        status_code: "{{ immich_healthcheck_status_codes }}"
        return_content: false
      register: immich_health
      until: immich_health.status in immich_healthcheck_status_codes
      retries: "{{ immich_healthcheck_retries }}"
      delay: "{{ immich_healthcheck_delay }}"
