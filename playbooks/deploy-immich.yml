---
- name: Deploy immich stack to homelab-core
  hosts: homelab_core
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/homelab_core.yml
  pre_tasks:
    - name: Load optional NAS group var and secret overrides
      ansible.builtin.include_tasks: tasks/load-nas-overrides.yml
      vars:
        nas_override_var_files:
          - "{{ nas_config_group_vars_dir }}/all.yml"
          - "{{ nas_config_group_vars_dir }}/homelab_core.yml"
          - "{{ nas_config_secrets_dir }}/all.yml"
          - "{{ nas_config_secrets_dir }}/homelab_core.yml"

    - name: Check optional immich NAS env override file
      ansible.builtin.stat:
        path: "{{ immich_nas_env_file }}"
      register: immich_nas_env_stat

  tasks:
    - name: Skip immich deploy when disabled
      ansible.builtin.debug:
        msg: "Immich deploy disabled by homelab_stacks.immich.enabled flag."
      when: not (homelab_stacks.immich.enabled | default(true))

    - name: Deploy immich stack via role blueprint
      ansible.builtin.include_role:
        name: stack_immich
      when:
        - homelab_stacks.immich.enabled | default(true)
        - immich_use_role | default(true)

    - name: Deploy immich stack via legacy task flow
      ansible.builtin.include_tasks: tasks/deploy-immich-legacy.yml
      when:
        - homelab_stacks.immich.enabled | default(true)
        - not (immich_use_role | default(true))
