# Service endpoint checks for the minimal Docker stack.
homelab_core_healthcheck_url: http://127.0.0.1:8080
homelab_core_healthcheck_status: 200

# Memos stack settings (v1: direct host port, no reverse proxy).
memos_app_dir: /opt/memos
memos_data_dir: /opt/memos/data
memos_healthcheck_url: http://127.0.0.1:5230
memos_healthcheck_status: 200

# Journiv stack settings (v1: direct host port, no reverse proxy).
journiv_app_dir: /opt/journiv
journiv_data_dir: /opt/journiv/data
journiv_image: swalabtech/journiv-app:latest
journiv_app_user_fallback_uid: 1000
journiv_app_user_fallback_gid: 1000
journiv_healthcheck_url: http://127.0.0.1:8010/
journiv_healthcheck_status: 200
